<!doctype html>
<!-- GitHub social preview, 1280x640. Render with: node scripts/social/render.mjs -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Flockbook social preview</title>
<style>
	:root {
		--bg: #ffffff;
		--fg: #1d1d1f;
		--fg-2: #6e6e73;
		--line: #e5e5e8;
		--soft: #f5f5f7;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; }
	body {
		width: 1280px;
		height: 640px;
		overflow: hidden;
		position: relative;
		background: linear-gradient(105deg, var(--bg) 0 46%, var(--soft) 100%);
		color: var(--fg);
		font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
		-webkit-font-smoothing: antialiased;
	}
	/* Text stays inside the safe area (80 px from every edge); only the screenshot bleeds. */
	.copy {
		position: absolute;
		left: 88px;
		top: 0;
		bottom: 0;
		width: 440px;
		display: flex;
		flex-direction: column;
		justify-content: center;
	}
	.mark { width: 128px; height: 128px; margin: 0 0 22px -14px; display: block; }
	h1 { margin: 0; font-size: 64px; line-height: 1; letter-spacing: -0.03em; font-weight: 700; }
	h1 span { display: block; margin-top: 8px; font-size: 34px; letter-spacing: -0.02em; font-weight: 600; color: var(--fg-2); }
	.pitch { margin: 28px 0 0; font-size: 27px; line-height: 1.3; letter-spacing: -0.01em; }
	.meta { margin: 22px 0 0; font-size: 18px; color: var(--fg-2); }
	.shot {
		position: absolute;
		left: 560px;
		top: 112px;
		width: 1120px;
		filter: drop-shadow(0 0 0.5px rgb(0 0 0 / 0.25)) drop-shadow(0 18px 40px rgb(0 0 0 / 0.14));
	}
	.shot img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
	<div class="copy">
		<img class="mark" src="../../static/flockbook-light.svg" alt="" />
		<h1>Flockbook<span>for Herdr</span></h1>
		<p class="pitch">Your Herdr agents’ conversations,<br />made readable.</p>
		<p class="meta">Native macOS 26 · Free · MIT · Unofficial</p>
	</div>
	<div class="shot"><img src="../../static/media/conversation-light.png" alt="" /></div>
</body>
</html>
