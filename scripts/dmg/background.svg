<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
<!-- Flockbook dmg window background. Mid-tone graphite on purpose: Finder draws icon labels black in light mode
     and white in dark mode, and both stay readable here (label row ~#77777C: 4.6:1 black, 4.5:1 white).
     Render: rsvg-convert -w 640 background.svg -o background.png; rsvg-convert -w 1280 background.svg -o background@2x.png -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="#86868C"/><stop offset="1" stop-color="#68686D"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.38" r="0.62"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <path id="bird" d="M-50 12 L0 -28 L0 -6 Z M0 -28 L50 12 L0 -6 Z"/>
</defs>
<rect width="640" height="400" fill="url(#bg)"/>
<rect width="640" height="400" fill="url(#glow)"/>
<!-- faint flock in V formation, top right -->
<g fill="#FFFFFF" fill-opacity="0.07">
  <use href="#bird" transform="translate(560 54) scale(0.42)"/>
  <use href="#bird" transform="translate(528 78) scale(0.30)"/>
  <use href="#bird" transform="translate(592 78) scale(0.30)"/>
  <use href="#bird" transform="translate(500 98) scale(0.22)"/>
  <use href="#bird" transform="translate(620 98) scale(0.22)"/>
</g>
<!-- drag hint: three arrowheads flying from the app (x 160) to Applications (x 480) -->
<g fill="#FFFFFF">
  <use href="#bird" transform="translate(284 180) rotate(90) scale(0.42)" fill-opacity="0.35"/>
  <use href="#bird" transform="translate(320 180) rotate(90) scale(0.42)" fill-opacity="0.6"/>
  <use href="#bird" transform="translate(356 180) rotate(90) scale(0.42)" fill-opacity="0.92"/>
</g>
<text x="320" y="330" text-anchor="middle" font-family="SF Pro Text, -apple-system, Helvetica Neue, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.92" letter-spacing="0.2">Drag Flockbook to Applications</text>
</svg>
