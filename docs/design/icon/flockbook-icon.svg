<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<title>Flockbook</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfdfe"/><stop offset="1" stop-color="#d5d9e0"/></linearGradient>
  <radialGradient id="glow" cx=".3" cy=".18" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0f3"/><stop offset="1" stop-color="#dde1e7"/></linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f3f6"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="card" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="16"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
</defs>
<!-- squircle body (Apple macOS grid: 824 on 1024) -->
<g filter="url(#drop)">
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
</g>
<g clip-path="url(#sq)">
  <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  <!-- back card -->
  <rect x="322" y="262" width="380" height="300" rx="56" fill="#c3c8d0"/>
  <!-- middle card -->
  <g filter="url(#card)"><rect x="272" y="338" width="480" height="320" rx="62" fill="url(#mid)"/></g>
  <rect x="272" y="338" width="480" height="320" rx="62" fill="url(#sheen)"/>
  <rect x="273.5" y="339.5" width="477" height="317" rx="60.5" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="3"/>
  <!-- front card: one agent, working -->
  <g filter="url(#card)"><rect x="212" y="430" width="600" height="360" rx="72" fill="url(#front)"/></g>
  <rect x="213.5" y="431.5" width="597" height="357" rx="70.5" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="3"/>
  <circle cx="362" cy="610" r="74" fill="none" stroke="#d9e8ff" stroke-width="34"/>
  <path d="M362 536 A74 74 0 1 1 288 610" fill="none" stroke="#007AFF" stroke-width="34" stroke-linecap="round"/>
  <rect x="482" y="566" width="230" height="36" rx="18" fill="#c9ced6"/>
  <rect x="482" y="630" width="150" height="36" rx="18" fill="#c9ced6" opacity=".6"/>
</g>
<rect x="100.75" y="100.75" width="822.5" height="822.5" rx="184.25" fill="none" stroke="#000" stroke-opacity=".14" stroke-width="1.5"/>
</svg>
