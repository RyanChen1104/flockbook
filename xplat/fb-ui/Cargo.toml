[package]
name = "fb-ui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Reusable iced widgets, theme tokens, fonts and icons for Flockbook"

[dependencies]
iced = { workspace = true, features = ["svg", "canvas", "tiny-skia"] }
unicode-segmentation = "1"
# We feed bytes; we never spawn a pty.
alacritty_terminal = { version = "0.26", default-features = false }

[dev-dependencies]
iced_test.workspace = true
png.workspace = true
