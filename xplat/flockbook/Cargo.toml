[package]
name = "flockbook"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Flockbook: a reading view for Herdr agents (iced)"

[lib]
name = "flockbook"
path = "src/lib.rs"

[[bin]]
name = "flockbook"
path = "src/main.rs"

[dependencies]
iced = { workspace = true, features = ["svg", "canvas", "tiny-skia", "tokio"] }
iced_test.workspace = true
fb-ui = { path = "../fb-ui" }
herdr-core = { path = "../herdr-core" }
png.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json.workspace = true
pulldown-cmark = { version = "0.12", default-features = false }
window-vibrancy = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSColor", "NSGraphics", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace"] }
